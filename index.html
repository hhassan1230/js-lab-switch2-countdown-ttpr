<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, minimum-scale=1.0, initial-scale=1.0"
    />
    <title>The TTPR Switch 2 Release 2025</title>
    <link rel="stylesheet" href="css/style.css" type="text/css" media="all" />
    <script src="js/main.js" defer></script>
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  </head>

  <body>
    <main class="title">
      <img src="img/switch2imgmini.png" alt="Switch 2 Countdown" />

      <div id="countdown"></div>

      <!-- 🔊 Coin Sound (optional, but recommended) -->
      <audio id="coinSound" src="sounds/coin.mp3" preload="auto"></audio>
    </main>

    <!-- 🎊 Confetti library (must be before </body>) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </body>
</html>
